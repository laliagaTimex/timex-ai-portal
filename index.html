<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timex AI Portal</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f4f0;--ink:#1a1a18;--muted:#888;--line:#e8e6e0;--accent:#6c5af5;--side:272px}
html,body{height:100%}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;overflow:hidden}
button{font-family:inherit}
.app{display:grid;grid-template-columns:var(--side) 1fr;height:100vh;transition:grid-template-columns .2s}
.app.collapsed{grid-template-columns:64px 1fr}
.app.locked{filter:blur(6px);pointer-events:none;user-select:none}

/* Sidebar */
.side{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.brand{padding:20px 20px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.brand img{height:26px;width:auto;align-self:flex-start;max-width:100%}
.brand-sub{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.brand-mini{display:none;font-weight:700;font-size:15px;text-align:center}
.collapsed .brand img,.collapsed .brand-sub{display:none}
.collapsed .brand-mini{display:block}
.side-search{padding:12px 14px 4px}
.side-search input{width:100%;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:#faf9f6;font-size:12px;font-family:inherit;outline:none}
.side-search input:focus{border-color:#bbb;background:#fff}
.collapsed .side-search{display:none}
.nav{flex:1;overflow-y:auto;padding:8px 10px 12px}
.nav-group{font-size:9px;text-transform:uppercase;letter-spacing:.14em;color:#aaa;font-weight:600;padding:14px 10px 6px}
.collapsed .nav-group{text-align:center;padding:10px 0 4px;font-size:0}
.collapsed .nav-group::after{content:'·';font-size:14px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:10px;border:none;background:none;cursor:pointer;text-align:left;color:#333;font-size:13px;transition:background .12s}
.nav-item:hover{background:#f5f4f0}
.nav-item.active{background:var(--ink);color:#fff}
.nav-item.active .nav-desc{color:rgba(255,255,255,.5)}
.nav-ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;background:#f5f4f0}
.nav-item.active .nav-ico{background:rgba(255,255,255,.12)}
.nav-txt{min-width:0;flex:1}
.nav-name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-desc{font-size:10px;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-badge{font-size:10px;font-weight:600;background:#f0eeff;color:#6c5af5;border-radius:10px;padding:1px 7px}
.nav-item.active .nav-badge{background:rgba(255,255,255,.15);color:#fff}
.nav-dot{width:6px;height:6px;border-radius:50%;background:#1d9e75;flex-shrink:0}
.collapsed .nav-txt,.collapsed .nav-dot,.collapsed .nav-badge{display:none}
.collapsed .nav-item{justify-content:center;padding:8px 0}
.nav-empty{font-size:12px;color:#bbb;padding:12px 10px;font-style:italic}
.side-foot{border-top:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:4px}
.user-pill{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:#faf9f6;font-size:11px;overflow:hidden}
.uav{width:26px;height:26px;border-radius:50%;background:#6366f1;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.user-pill .em{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#333;font-weight:500}
.user-pill button{border:none;background:none;color:#999;cursor:pointer;font-size:11px}
.user-pill button:hover{color:var(--ink)}
.collapsed .user-pill .em,.collapsed .user-pill button{display:none}
.collapsed .user-pill{justify-content:center}

/* Main */
.main{display:flex;flex-direction:column;min-width:0;height:100vh}
.topbar{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 18px;flex-shrink:0}
.icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;color:#555;flex-shrink:0}
.icon-btn:hover{background:#f5f4f0;color:var(--ink)}
.crumb{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.crumb-ico{font-size:18px}
.crumb-title{font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb-sub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;gap:6px}
.view{flex:1;min-height:0;position:relative}
.view-pane{position:absolute;inset:0;overflow:auto;display:none}
.view-pane.show{display:block}
.frame-host{position:absolute;inset:0;display:none;background:#fff}
.frame-host.show{display:block}
.frame-host iframe{position:absolute;inset:0;width:100%;height:100%;border:none;display:none;background:#fff}
.frame-host iframe.show{display:block}
.loader{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:rgba(245,244,240,.85);z-index:5;font-size:12px;color:#888}
.loader.show{display:flex}
.spin{width:28px;height:28px;border:3px solid #e0ddd8;border-top-color:var(--ink);border-radius:50%;animation:sp .8s linear infinite}
.spin.sm{width:16px;height:16px;border-width:2px}
@keyframes sp{to{transform:rotate(360deg)}}

/* Pages */
.wrap{max-width:1180px;margin:0 auto;padding:28px 28px 48px}
.hero{background:var(--ink);color:#fff;border-radius:16px;padding:28px 32px;position:relative;overflow:hidden;margin-bottom:24px}
.hero::before{content:'';position:absolute;right:-50px;top:-50px;width:240px;height:240px;border-radius:50%;border:1px solid rgba(255,255,255,.08)}
.hero.lib{background:linear-gradient(135deg,#1e1b4b,#312e81 60%,#4338ca)}
.hero.ana{background:linear-gradient(135deg,#064e3b,#065f46 50%,#047857)}
.hero-label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:6px}
.hero-title{font-size:26px;font-weight:600;letter-spacing:-.02em;margin-bottom:4px}
.hero-sub{font-size:13px;color:rgba(255,255,255,.6);max-width:680px}
.hero-stats{display:flex;gap:28px;margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.12);flex-wrap:wrap}
.hs-num{font-size:22px;font-weight:600}
.hs-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.45)}
.sec-title{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#555;margin:6px 0 14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-bottom:28px}
.app-card{background:#fff;border:1px solid rgba(0,0,0,.07);border-radius:14px;padding:18px 20px;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;gap:10px}
.app-card:hover{box-shadow:0 6px 22px rgba(0,0,0,.08);transform:translateY(-2px)}
.ac-head{display:flex;align-items:center;gap:12px}
.ac-ico{width:44px;height:44px;border-radius:12px;background:#f5f4f0;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.ac-name{font-size:14px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.ac-cat{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#aaa;margin-top:2px}
.ac-desc{font-size:12px;color:#666;line-height:1.55;min-height:36px}
.ac-foot{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:10px;color:#aaa;border-top:1px solid #f3f2ef;padding-top:10px}
.ac-open{font-size:11px;font-weight:600;color:var(--ink)}
.empty-box{background:#fff;border:2px dashed #d0cec7;border-radius:14px;padding:40px;text-align:center;color:#888}
.empty-box .big{font-size:36px;opacity:.4;margin-bottom:8px}

.btn{padding:8px 18px;border-radius:20px;border:1px solid var(--ink);background:var(--ink);color:#fff;font-size:12px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{opacity:.85}
.btn.ghost{background:#fff;color:#333;border-color:#d8d6d0}
.btn.ghost:hover{background:#f5f4f0;opacity:1}
.btn.danger{background:#fff;color:#a32d2d;border-color:#f7c1c1}
.btn.danger:hover{background:#fcebeb;opacity:1}
.btn.green{background:#059669;border-color:#059669}
.btn.sm{padding:5px 12px;font-size:11px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.card{background:#fff;border:1px solid rgba(0,0,0,.07);border-radius:14px;padding:22px 24px;margin-bottom:20px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.card-t{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#555}
.card-s{font-size:12px;color:#999;margin-top:2px}
.form-grid{display:grid;grid-template-columns:90px 1fr 1fr;gap:12px}
.fg{display:flex;flex-direction:column;gap:5px}
.fg.full{grid-column:1/-1}
.fg label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#888;font-weight:600}
.inp{padding:9px 12px;border-radius:9px;border:1px solid #ddd;font-size:13px;font-family:inherit;outline:none;background:#fff;color:var(--ink);width:100%}
.inp:focus{border-color:#888}
textarea.inp{resize:vertical;min-height:60px}
.inp.emoji{text-align:center;font-size:20px;padding:6px}
select.inp{cursor:pointer}
.drop{border:2px dashed #d0cec7;border-radius:10px;padding:18px;text-align:center;color:#888;font-size:12px;cursor:pointer;background:#fafaf7}
.drop:hover,.drop.over{border-color:var(--ink);background:#f5f4f0}
.drop b{color:var(--ink)}
.emoji-row{display:flex;flex-wrap:wrap;gap:4px}
.emoji-row button{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:15px}
.emoji-row button:hover{background:#f5f4f0}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{padding:9px 12px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#888;font-weight:500;background:#f9f8f5;border-bottom:1px solid #eee;white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid #f3f2ef;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:#fafaf8}
.tbl-wrap{overflow-x:auto;border:1px solid #eee;border-radius:10px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:'DM Mono',monospace;font-size:11px;color:#888}
.row-actions{display:flex;gap:4px;justify-content:flex-end}
.mini{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:12px;display:inline-flex;align-items:center;justify-content:center;color:#555}
.mini:hover{background:#f5f4f0}
.mini:disabled{opacity:.35;cursor:default}
.mini.del:hover{background:#fcebeb;color:#a32d2d;border-color:#f7c1c1}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:500;background:#f1efe8;color:#5f5e5a;white-space:nowrap}
.tag.green{background:#eaf3de;color:#3b6d11}.tag.amber{background:#fffbf0;color:#b07010}
.tag.red{background:#fcebeb;color:#a32d2d}.tag.blue{background:#e6f1fb;color:#185fa5}.tag.purple{background:#f0eeff;color:#5c35c9}
.note{font-size:11px;color:#999;line-height:1.6}
.warn-box{background:#fffbf0;border:1px solid #fde68a;color:#92400e;border-radius:10px;padding:12px 14px;font-size:12px;line-height:1.6;margin-bottom:16px}
.info-box{background:#f8f9ff;border:1px solid #e0e4ff;color:#3d4fc4;border-radius:10px;padding:12px 14px;font-size:12px;line-height:1.6;margin-bottom:16px}
.steps{padding-left:18px;font-size:12.5px;color:#444;line-height:1.9}
.steps code,.note code{background:#f5f4f0;padding:1px 5px;border-radius:4px;font-family:'DM Mono',monospace;font-size:11px}

/* KPI & bars */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid rgba(0,0,0,.07);border-radius:12px;padding:16px 18px}
.kpi-l{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#888;margin-bottom:4px}
.kpi-n{font-size:28px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.kpi-s{font-size:11px;color:#aaa;margin-top:2px}
.bars{display:flex;align-items:flex-end;gap:3px;height:170px;padding-top:10px;border-bottom:1px solid #eee}
.bar-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative;min-width:0}
.bar{width:100%;max-width:26px;background:#059669;border-radius:3px 3px 0 0;min-height:1px;transition:height .3s}
.bar-col:hover .bar{background:#047857}
.bar-tip{position:absolute;bottom:100%;background:var(--ink);color:#fff;font-size:10px;padding:3px 7px;border-radius:5px;white-space:nowrap;display:none;z-index:2;margin-bottom:4px}
.bar-col:hover .bar-tip{display:block}
.bar-x{display:flex;gap:3px;margin-top:4px}
.bar-x span{flex:1;font-size:9px;color:#aaa;text-align:center;overflow:hidden;white-space:nowrap}
.hbar{height:6px;background:#eef0ee;border-radius:3px;overflow:hidden;min-width:80px}
.hbar>div{height:100%;background:#059669;border-radius:3px}
.seg{display:inline-flex;border:1px solid #ddd;border-radius:20px;overflow:hidden}
.seg button{border:none;background:#fff;padding:6px 14px;font-size:12px;cursor:pointer;color:#555}
.seg button.on{background:var(--ink);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* Gate */
.gate{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(245,244,240,.75)}
.gate.show{display:flex}
.gate-box{background:#fff;border:1px solid var(--line);border-radius:20px;max-width:440px;width:100%;padding:38px 40px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.12)}
.gate-box img{height:32px;margin-bottom:6px}
.gate-box h1{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:12px 0 4px}
.gate-box p{font-size:13px;color:#777;line-height:1.6;margin-bottom:20px}
.gate-box .inp{text-align:center;font-size:14px;padding:12px}
.gate-err{color:#a32d2d;font-size:12px;min-height:18px;margin:8px 0}
.gate-dom{font-size:11px;color:#aaa;margin-top:14px}

/* Modal / toast */
.modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(3px)}
.modal-box{position:relative;background:#fff;border-radius:16px;max-width:580px;width:100%;max-height:88vh;overflow:auto;padding:24px 26px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-box h3{font-size:17px;font-weight:600;letter-spacing:-.01em;margin-bottom:6px}
.modal-box .msg{font-size:13px;color:#666;line-height:1.6;margin-bottom:16px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.chk{display:flex;align-items:center;gap:8px;font-size:12px;color:#555;cursor:pointer}
.toast{position:fixed;bottom:22px;right:22px;z-index:90;background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);transform:translateY(80px);opacity:0;transition:all .25s;max-width:420px}
.toast.show{transform:none;opacity:1}
.toast.bad{background:#a32d2d}
.busy{position:fixed;inset:0;z-index:85;background:rgba(255,255,255,.55);display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;font-size:13px;color:#555}
.busy.show{display:flex}
@media(max-width:900px){.kpis{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}}
</style>
</head>

<script>
/* ════════════════════════════════════════════════════════════════
   TIMEX AI PORTAL v2 — GitHub Pages edition
   Portal repo (public, GitHub Pages):  index.html, portal-config.json, apps/*.html
   Data repo (private):  analytics/YYYY-MM/DD.json · library/<user>/… · submissions.json
   ════════════════════════════════════════════════════════════════ */
const LS_ADMIN='txp_admin_v2', LS_LAST='txp_last_email';
const EMOJIS=['📊','📈','📋','🤖','🧠','🏛️','📦','🚚','🏭','⌚','💰','🔗','🗂️','🧾','📅','🛠️','🔍','✅','🌐','📑'];
const API='https://api.github.com';

let config=null, user=null, currentId='home', admin=null, lib=null, libLoading=false;
const frames={};
let anaDays=30, anaCache=null;

/* ── helpers ── */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m,bad){const t=$('toast');t.textContent=m;t.className='toast show'+(bad?' bad':'');clearTimeout(t._t);t._t=setTimeout(()=>t.className='toast',3200);}
function busy(on,txt){$('busy').classList.toggle('show',!!on);if(txt)$('busyTxt').textContent=txt;}
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60)||'item';
const fmtSize=b=>b==null?'—':b>1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
const fmtDate=iso=>iso?new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'—';
const fmtDT=iso=>iso?new Date(iso).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'—';
const localDay=d=>d.toLocaleDateString('en-CA'); // YYYY-MM-DD in local time
const AV=['#6366f1','#0891b2','#059669','#d97706','#dc2626','#7c3aed','#db2777','#0284c7'];
const avColor=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%AV.length;return AV[h];};
const initials=e=>(e.split('@')[0].split(/[._-]/).filter(Boolean).map(w=>w[0]).slice(0,2).join('')||'?').toUpperCase();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const obf=t=>t?'x1.'+btoa(t.split('').reverse().join('')):'';
const deobf=k=>{try{return k&&k.startsWith('x1.')?atob(k.slice(3)).split('').reverse().join(''):'';}catch(e){return '';}};
function stripRuntime(o){return JSON.parse(JSON.stringify(o,(k,v)=>k.startsWith('_')?undefined:v));}

/* ── GitHub API ── */
async function gh(token,path,opt={}){
  const headers={'Accept':opt.raw?'application/vnd.github.raw+json':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  if(token)headers.Authorization='Bearer '+token;
  if(opt.body)headers['Content-Type']='application/json';
  const r=await fetch(API+path,{method:opt.method||'GET',headers,body:opt.body?JSON.stringify(opt.body):undefined,cache:'no-store'});
  if(opt.allow404&&r.status===404)return null;
  if(!r.ok){let m='';try{m=(await r.json()).message;}catch(e){}const err=new Error('GitHub '+r.status+(m?': '+m:''));err.status=r.status;throw err;}
  if(r.status===204)return null;
  if(opt.raw)return opt.binary?r.arrayBuffer():r.text();
  return r.json();
}
const encPath=p=>p.split('/').map(encodeURIComponent).join('/');
const base=R=>`/repos/${R.owner}/${R.repo}`;
function readFile(R,path,ref,binary){return gh(R.token,`${base(R)}/contents/${encPath(path)}?ref=${encodeURIComponent(ref||R.branch)}`,{raw:true,binary,allow404:true});}
async function listDir(R,path){const r=await gh(R.token,`${base(R)}/contents/${encPath(path)}?ref=${encodeURIComponent(R.branch)}`,{allow404:true});return Array.isArray(r)?r:[];}
function b64(buf){const b=new Uint8Array(buf);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s);}
/* One atomic commit with automatic retry when someone else pushed first.
   build(read) returns [{path, content: string|ArrayBuffer|null(delete)}] computed from the latest commit. */
async function commit(R,message,build){
  for(let attempt=0;attempt<6;attempt++){
    const ref=await gh(R.token,`${base(R)}/git/ref/heads/${encodeURIComponent(R.branch)}`);
    const head=ref.object.sha;
    const c=await gh(R.token,`${base(R)}/git/commits/${head}`);
    const changes=await build(p=>readFile(R,p,head));
    if(!changes||!changes.length)return null;
    const tree=[];
    for(const ch of changes){
      if(ch.content===null){tree.push({path:ch.path,mode:'100644',type:'blob',sha:null});continue;}
      const bin=typeof ch.content!=='string';
      const blob=await gh(R.token,`${base(R)}/git/blobs`,{method:'POST',body:bin?{content:b64(ch.content),encoding:'base64'}:{content:ch.content,encoding:'utf-8'}});
      tree.push({path:ch.path,mode:'100644',type:'blob',sha:blob.sha});
    }
    const t=await gh(R.token,`${base(R)}/git/trees`,{method:'POST',body:{base_tree:c.tree.sha,tree}});
    const nc=await gh(R.token,`${base(R)}/git/commits`,{method:'POST',body:{message,tree:t.sha,parents:[head]}});
    try{await gh(R.token,`${base(R)}/git/refs/heads/${encodeURIComponent(R.branch)}`,{method:'PATCH',body:{sha:nc.sha,force:false}});return nc.sha;}
    catch(e){if(e.status!==422&&e.status!==409)throw e;await new Promise(r=>setTimeout(r,250+Math.random()*1000*(attempt+1)));}
  }
  throw new Error('The repository is busy. Please try again.');
}
function dataRepo(){const d=config&&config.data;const token=d&&deobf(d.key);return d&&d.owner&&d.repo&&token?{owner:d.owner,repo:d.repo,branch:d.branch||'main',token}:null;}

/* ── Config ── */
function detectRepo(){
  const h=location.hostname;if(!h.endsWith('.github.io'))return null;
  const owner=h.split('.')[0];const seg=location.pathname.split('/').filter(Boolean);
  return {owner,repo:seg.length&&!/\.html?$/i.test(seg[0])?seg[0]:h};
}
function normalize(c){
  c=c||{};
  const d=detectRepo();
  return {version:2,portalTitle:c.portalTitle||'AI Portal',portalSubtitle:c.portalSubtitle||'Timex Group Philippines · Supply Chain AI Programs',
    allowedDomains:Array.isArray(c.allowedDomains)&&c.allowedDomains.length?c.allowedDomains:['timex.com','timexgroup.com'],
    github:Object.assign({owner:d?d.owner:'',repo:d?d.repo:'',branch:'main'},c.github||{}),
    data:Object.assign({owner:'',repo:'',branch:'main',key:''},c.data||{}),
    apps:Array.isArray(c.apps)?c.apps:[],updatedAt:c.updatedAt||null};
}
async function loadConfig(){
  try{const r=await fetch('portal-config.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;config=normalize(await r.json());}
  catch(e){config=normalize({});}
}

/* ── Boot & email gate ── */
async function boot(){
  await loadConfig();
  try{admin=JSON.parse(localStorage.getItem(LS_ADMIN)||'null');}catch(e){admin=null;}
  $('gateTitle').textContent=config.portalTitle;
  $('gateDom').textContent='Allowed: '+config.allowedDomains.map(d=>'@'+d).join(', ');
  $('gateEmail').placeholder='name@'+config.allowedDomains[0];
  try{$('gateEmail').value=localStorage.getItem(LS_LAST)||'';}catch(e){}
  $('gate').classList.add('show');
  setTimeout(()=>$('gateEmail').focus(),60);
}
function enterPortal(){
  const em=$('gateEmail').value.trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){$('gateErr').textContent='Enter a valid email address.';return;}
  const dom=em.split('@')[1];
  if(!config.allowedDomains.some(d=>dom===d.toLowerCase()||dom.endsWith('.'+d.toLowerCase()))){$('gateErr').textContent='Only company emails are allowed ('+config.allowedDomains.map(d=>'@'+d).join(', ')+').';return;}
  user=em;try{localStorage.setItem(LS_LAST,em);}catch(e){}
  $('gate').classList.remove('show');$('appRoot').classList.remove('locked');
  $('uEmail').textContent=em;$('uAv').textContent=initials(em);$('uAv').style.background=avColor(em);
  logEvent('login',null);
  go('home');
}
function signOut(){Object.keys(frames).forEach(closeFrame);user=null;lib=null;$('appRoot').classList.add('locked');$('gateEmail').value='';$('gateErr').textContent='';$('gate').classList.add('show');setTimeout(()=>$('gateEmail').focus(),60);}

/* ── Analytics logging (data repo) ── */
async function logEvent(ev,app){
  const R=dataRepo();if(!R||!user)return;
  const now=new Date();const day=localDay(now);
  const path=`analytics/${day.slice(0,7)}/${day.slice(8)}.json`;
  const rec={t:now.toISOString(),e:user,ev,a:app?app.id:null,n:app?app.name:null};
  try{
    await commit(R,`analytics: ${ev}${rec.n?' '+rec.n:''} (${user})`,async read=>{
      let arr=[];const cur=await read(path);try{arr=cur?JSON.parse(cur):[];}catch(e){}
      arr.push(rec);return [{path,content:JSON.stringify(arr)}];
    });
    anaCache=null;
  }catch(e){console.warn('Analytics not recorded:',e.message);}
}

/* ── Navigation ── */
const visibleApps=()=>config.apps.filter(a=>!a.hidden);
function renderNav(){
  const q=($('navSearch').value||'').toLowerCase();
  const it=(id,ico,name,desc,extra='')=>`<button class="nav-item ${currentId===id?'active':''}" onclick="go('${id}')" title="${esc(name)}"><span class="nav-ico">${esc(ico)}</span><span class="nav-txt"><div class="nav-name">${esc(name)}</div><div class="nav-desc">${esc(desc)}</div></span>${extra}</button>`;
  let h=it('home','🏠','Home','All programs');
  h+=it('library','📚','My Library','Your own tools',lib?`<span class="nav-badge">${lib.items.length}</span>`:'');
  h+=it('analytics','📈','Analytics','Usage & users');
  const apps=visibleApps().filter(a=>!q||(a.name+' '+(a.description||'')+' '+(a.category||'')).toLowerCase().includes(q));
  const groups={};apps.forEach(a=>{const g=a.category||'General';(groups[g]=groups[g]||[]).push(a);});
  Object.keys(groups).forEach(g=>{
    h+=`<div class="nav-group">${esc(g)}</div>`;
    groups[g].forEach(a=>{h+=it(a.id,a.icon||'📄',a.name,a.description||a.file,frames[a.id]&&currentId!==a.id?'<span class="nav-dot" title="Open in background"></span>':'');});
  });
  if(lib&&lib.items.length){
    const li=lib.items.filter(x=>!q||x.name.toLowerCase().includes(q));
    if(li.length){h+=`<div class="nav-group">My Library</div>`;li.forEach(x=>{h+=it('lib:'+x.id,x.icon||'📄',x.name,x.description||'Personal tool',frames['lib:'+x.id]&&currentId!=='lib:'+x.id?'<span class="nav-dot"></span>':'');});}
  }
  if(!apps.length&&!visibleApps().length)h+=`<div class="nav-empty">No published apps yet.</div>`;
  $('nav').innerHTML=h;
  $('navAdmin').classList.toggle('active',currentId==='admin');
  $('adminDesc').textContent=admin?'Connected · '+admin.owner+'/'+admin.repo:'Publish apps to GitHub';
  $('brandSub').textContent=config.portalTitle;document.title='Timex '+config.portalTitle;
}
function setCrumb(i,t,s){$('crumbIco').textContent=i;$('crumbTitle').textContent=t;$('crumbSub').textContent=s||'';}
function showPane(w){['home','library','analytics','admin'].forEach(p=>$('pane-'+p).classList.toggle('show',w===p));$('frameHost').classList.toggle('show',w==='frame');$('appActions').style.display=w==='frame'?'flex':'none';}
async function go(id){
  if(!user)return;
  currentId=id;
  if(id==='home'){showPane('home');setCrumb('🏠','Home',config.portalSubtitle);renderHome();}
  else if(id==='library'){showPane('library');setCrumb('📚','My Library',user);renderLibrary();}
  else if(id==='analytics'){showPane('analytics');setCrumb('📈','Analytics','How often each app is opened, and by how many users');renderAnalytics();}
  else if(id==='admin'){showPane('admin');setCrumb('⚙️','Admin Control','Upload, edit and publish apps to GitHub');renderAdmin();}
  else if(id.startsWith('lib:')){
    const x=lib&&lib.items.find(i=>'lib:'+i.id===id);if(!x)return go('library');
    showPane('frame');setCrumb(x.icon||'📄',x.name,'My Library · '+x.file);await showLibFrame(x);
  }else{
    const a=config.apps.find(x=>x.id===id);if(!a)return go('home');
    showPane('frame');setCrumb(a.icon||'📄',a.name,(a.category||'General'));
    const fresh=!frames[a.id];showAppFrame(a);if(fresh)logEvent('open',a);
  }
  renderNav();
  if(!lib&&!libLoading)loadLibrary().then(renderNav).catch(()=>{});
}

/* ── Frames ── */
function hideFrames(){Object.values(frames).forEach(f=>f.iframe.classList.remove('show'));}
function makeFrame(key,src,label){
  $('loader').classList.add('show');$('loaderTxt').textContent='Loading '+label+'…';
  const ifr=document.createElement('iframe');
  ifr.setAttribute('allow','fullscreen; clipboard-read; clipboard-write');ifr.setAttribute('allowfullscreen','');
  ifr.onload=()=>$('loader').classList.remove('show');ifr.src=src;
  $('frameHost').appendChild(ifr);frames[key]={iframe:ifr,url:src};
  setTimeout(()=>$('loader').classList.remove('show'),15000);
}
function showAppFrame(a){hideFrames();if(!frames[a.id])makeFrame(a.id,'apps/'+encodeURIComponent(a.file)+'?v='+(a.v||1),a.name);frames[a.id].iframe.classList.add('show');}
async function showLibFrame(x){
  hideFrames();const key='lib:'+x.id;
  if(!frames[key]){
    const R=dataRepo();if(!R)return toast('Library storage is not set up yet',true);
    $('loader').classList.add('show');$('loaderTxt').textContent='Loading '+x.name+'…';
    try{const buf=await readFile(R,libDir()+'/files/'+x.file,null,true);if(!buf)throw new Error('file not found');
      makeFrame(key,URL.createObjectURL(new Blob([buf],{type:'text/html'})),x.name);frames[key].blob=true;}
    catch(e){$('loader').classList.remove('show');toast('Could not open: '+e.message,true);return go('library');}
  }
  frames[key].iframe.classList.add('show');
}
function closeFrame(k){const f=frames[k];if(!f)return;f.iframe.remove();if(f.blob)URL.revokeObjectURL(f.url);delete frames[k];}
function reloadCurrent(){const k=currentId;closeFrame(k);go(k);}
function closeCurrent(){closeFrame(currentId);go(currentId.startsWith('lib:')?'library':'home');}
function openNewTab(){const f=frames[currentId];if(f)window.open(f.url,'_blank');}
function fullscreen(){const f=frames[currentId];if(f&&f.iframe.requestFullscreen)f.iframe.requestFullscreen();}

/* ── Home ── */
function cardHtml(onclick,ico,name,cat,desc,foot){return `<div class="app-card" onclick="${onclick}"><div class="ac-head"><div class="ac-ico">${esc(ico||'📄')}</div><div><div class="ac-name">${esc(name)}</div><div class="ac-cat">${esc(cat)}</div></div></div><div class="ac-desc">${esc(desc||'No description.')}</div><div class="ac-foot"><span>${foot}</span><span class="ac-open">Open →</span></div></div>`;}
function renderHome(){
  const apps=visibleApps();const cats=new Set(apps.map(a=>a.category||'General'));
  let h=`<div class="wrap"><div class="hero"><div class="hero-label">Timex Group · ${esc(config.portalTitle)}</div>
    <div class="hero-title">Welcome, ${esc(user.split('@')[0].split(/[._]/)[0].replace(/^./,c=>c.toUpperCase()))}</div>
    <div class="hero-sub">${esc(config.portalSubtitle)}. Choose a program on the left or below, and it opens here.</div>
    <div class="hero-stats"><div><div class="hs-num">${apps.length}</div><div class="hs-lbl">Programs</div></div><div><div class="hs-num">${cats.size}</div><div class="hs-lbl">Categories</div></div><div><div class="hs-num">${lib?lib.items.length:'…'}</div><div class="hs-lbl">In My Library</div></div></div></div>`;
  if(!apps.length)h+=`<div class="empty-box"><div class="big">🗂️</div><div style="font-size:15px;font-weight:600;color:#333">No programs published yet</div><div style="font-size:12px;margin-top:4px">An admin can publish apps from Admin Control.</div></div>`;
  const groups={};apps.forEach(a=>{const g=a.category||'General';(groups[g]=groups[g]||[]).push(a);});
  Object.keys(groups).forEach(g=>{h+=`<div class="sec-title">${esc(g)}</div><div class="cards">`+groups[g].map(a=>cardHtml(`go('${a.id}')`,a.icon,a.name,g,a.description,'Updated '+fmtDate(a.updatedAt||a.addedAt))).join('')+`</div>`;});
  $('pane-home').innerHTML=h+'</div>';
}

/* ── My Library (data repo: library/<user>/library.json + files/) ── */
const libDir=()=>'library/'+slug(user);
async function loadLibrary(){
  const R=dataRepo();if(!R||!user){lib={items:[]};return;}
  libLoading=true;
  try{const t=await readFile(R,libDir()+'/library.json');lib=t?JSON.parse(t):{email:user,items:[]};if(!Array.isArray(lib.items))lib.items=[];}
  catch(e){lib={items:[],_err:e.message};}
  finally{libLoading=false;}
  if(currentId==='library')renderLibrary();
}
async function saveLibrary(message,mutate,extra){
  const R=dataRepo();
  await commit(R,message,async read=>{
    const cur=await read(libDir()+'/library.json');let l=cur?JSON.parse(cur):{email:user,items:[]};
    const more=await mutate(l,read)||[];l.email=user;l.updatedAt=new Date().toISOString();lib=l;
    return [{path:libDir()+'/library.json',content:JSON.stringify(l,null,2)},...(extra||[]),...more];
  });
}
function renderLibrary(){
  const p=$('pane-library');const R=dataRepo();
  if(!R){p.innerHTML=`<div class="wrap"><div class="empty-box"><div class="big">📚</div><div style="font-size:15px;font-weight:600;color:#333">My Library isn't set up yet</div><div style="font-size:12px;margin-top:4px">An admin needs to connect the data repository in Admin Control → Data Storage.</div></div></div>`;return;}
  if(!lib||libLoading){p.innerHTML=`<div class="wrap"><div class="empty-box"><div class="spin" style="margin:0 auto 10px"></div>Loading your library…</div></div>`;if(!libLoading)loadLibrary();return;}
  const st={submitted:'<span class="tag amber">Submitted for review</span>',published:'<span class="tag green">Published to portal</span>',rejected:'<span class="tag red">Not approved</span>'};
  let h=`<div class="wrap"><div class="hero lib"><div class="hero-label">My Library · ${esc(user)}</div><div class="hero-title">Your personal tools</div>
    <div class="hero-sub">Upload your own HTML tools. Only you see them here. When one is ready, submit it and the admin can publish it to the whole portal.</div>
    <div class="hero-stats"><div><div class="hs-num">${lib.items.length}</div><div class="hs-lbl">Tools</div></div><div><div class="hs-num">${lib.items.filter(x=>x.status==='submitted').length}</div><div class="hs-lbl">Awaiting review</div></div><div><div class="hs-num">${lib.items.filter(x=>x.status==='published').length}</div><div class="hs-lbl">Published</div></div></div></div>`;
  if(lib._err)h+=`<div class="warn-box">Could not read your library: ${esc(lib._err)}</div>`;
  h+=`<div class="sec-title">My tools</div>`;
  if(lib.items.length){
    h+=`<div class="cards">`+lib.items.map(x=>`<div class="app-card" onclick="go('lib:${x.id}')"><div class="ac-head"><div class="ac-ico">${esc(x.icon||'📄')}</div><div style="flex:1;min-width:0"><div class="ac-name">${esc(x.name)}</div><div class="ac-cat">${fmtSize(x.size)} · ${fmtDate(x.updatedAt||x.addedAt)}</div></div></div>
      <div class="ac-desc">${esc(x.description||'No description.')}</div>
      <div class="ac-foot"><span>${st[x.status]||'<span class="tag">Private</span>'}</span><span class="row-actions" onclick="event.stopPropagation()">
        <button class="mini" title="Edit details" onclick="libEdit('${x.id}')">✎</button>
        <button class="mini" title="Upload a new version" onclick="libReplace('${x.id}')">⇪</button>
        <button class="mini" title="Submit to publish on the portal" onclick="libSubmit('${x.id}')" ${x.status==='submitted'||x.status==='published'?'disabled':''}>🚀</button>
        <button class="mini del" title="Delete" onclick="libDelete('${x.id}')">🗑</button></span></div></div>`).join('')+`</div>`;
  }else h+=`<div class="empty-box" style="margin-bottom:24px"><div class="big">📚</div>No tools yet. Add your first one below.</div>`;
  h+=addFormHtml('l','➕ Add a Tool to My Library','The file is saved to your private library on GitHub.','libAdd()','➕ Add to My Library')+'</div>';
  p.innerHTML=h;wireDrop('l');
}
async function libAdd(){
  const f=readAddForm('l');if(!f)return;
  busy(true,'Saving to your library…');
  try{
    const id=uid(),file=slug(f.name)+'-'+id+'.html';const buf=await f.file.arrayBuffer();
    await saveLibrary(`library: add ${f.name} (${user})`,l=>{l.items.push({id,name:f.name,icon:f.icon,category:f.category,description:f.description,file,size:f.file.size,addedAt:new Date().toISOString(),status:null});},[{path:libDir()+'/files/'+file,content:buf}]);
    toast('Added "'+f.name+'" to My Library');renderLibrary();renderNav();
  }catch(e){toast('Save failed: '+e.message,true);}finally{busy(false);}
}
function libEdit(id){const x=lib.items.find(i=>i.id===id);editModal(x,`libSaveEdit('${id}')`);}
async function libSaveEdit(id){

async function fetchAnalytics(days){
  const R=dataRepo();if(!R)throw new Error('not-configured');
  const end=new Date(),start=new Date();start.setDate(end.getDate()-days+1);
  const s=localDay(start),e=localDay(end);
  const months=[];const m=new Date(start.getFullYear(),start.getMonth(),1);
  while(localDay(m).slice(0,7)<=e.slice(0,7)){months.push(localDay(m).slice(0,7));m.setMonth(m.getMonth()+1);}
  const files=[];
  for(const mo of months){(await listDir(R,'analytics/'+mo)).forEach(f=>{const d=mo+'-'+f.name.replace('.json','');if(f.type==='file'&&d>=s&&d<=e)files.push(f.path);});}
  const events=[];let i=0;
  async function worker(){while(i<files.length){const p=files[i++];try{const t=await readFile(R,p);if(t)events.push(...JSON.parse(t));}catch(err){}}}
  await Promise.all([1,2,3,4,5,6].map(worker));
  return {events,start:s,end:e,days};
}

    <div class="hero-stats"><div><div class="hs-num">${opens.length}</div><div class="hs-lbl">App opens</div></div><div><div class="hs-num">${allUsers.size}</div><div class="hs-lbl">Unique users</div></div><div><div class="hs-num">${logins.length}</div><div class="hs-lbl">Portal visits</div></div><div><div class="hs-num">${top?esc(top.icon)+' '+esc(top.name):'—'}</div><div class="hs-lbl">Most used app</div></div></div></div>

      <div class="seg">${[7,30,90,365].map(n=>`<button class="${anaDays===n?'on':''}" onclick="setAnaDays(${n})">${n===365?'1 year':n+' days'}</button>`).join('')}</div>
      <div style="display:flex;gap:6px"><button class="btn ghost sm" onclick="anaCache=null;renderAnalytics()">↻ Refresh</button><button class="btn ghost sm" onclick="exportAnalytics()">⬇ Export CSV</button></div></div>

      <div class="bars">${series.map(s=>`<div class="bar-col"><div class="bar-tip">${fmtDate(s.k+'T12:00')} · ${s.opens} opens · ${s.users.size} users</div><div class="bar" style="height:${s.opens/maxD*100}%"></div></div>`).join('')}</div>

function adminRepo(){return admin?{owner:admin.owner,repo:admin.repo,branch:admin.branch||'main',token:admin.token}:null;}
async function adminConnect(){
  const a={owner:$('aOwner').value.trim(),repo:$('aRepo').value.trim(),branch:$('aBranch').value.trim()||'main',token:$('aToken').value.trim()};
  if(!a.repo||!a.token)return toast('Fill in repository and token',true);
  busy(true,'Checking your GitHub account…');
  try{
    const me=await gh(a.token,'/user');a.login=me.login;a.avatar=me.avatar_url;a.name=me.name||me.login;
    if(!a.owner)a.owner=me.login;
    const r=await gh(a.token,`/repos/${a.owner}/${a.repo}`);
    if(!(r.permissions&&r.permissions.push))throw new Error('this token cannot write to the repository');
    a.branch=$('aBranch').value.trim()||r.default_branch||'main';
    await gh(a.token,`/repos/${a.owner}/${a.repo}/git/ref/heads/${encodeURIComponent(a.branch)}`);
    admin=a;localStorage.setItem(LS_ADMIN,JSON.stringify(a));

}

/* Commit a config change (plus optional files) to the portal repo, always starting from the latest config in GitHub. */
async function publish(message,mutate,files){
  const R=adminRepo();
  await commit(R,message,async read=>{
    const cur=await read('portal-config.json');const c=normalize(cur?JSON.parse(cur):config);
    const more=await mutate(c)||[];c.updatedAt=new Date().toISOString();config=c;
    return [{path:'portal-config.json',content:JSON.stringify(stripRuntime(c),null,2)},...(files||[]),...more];
  });
}

async function wzCheckAccount(){
  const t=$('wzToken').value.trim();if(!t)return toast('Paste your token first',true);
  busy(true,'Checking your account…');
  try{
    const r=await fetch(API+'/user',{headers:{Authorization:'Bearer '+t,Accept:'application/vnd.github+json'},cache:'no-store'});
    if(!r.ok)throw new Error(r.status===401?'token is invalid or expired':'GitHub '+r.status);
    const scopes=r.headers.get('x-oauth-scopes');
    if(scopes!==null&&scopes!==''&&!scopes.split(',').map(x=>x.trim()).includes('repo'))throw new Error('this classic token is missing the "repo" scope');
    wz.token=t;wz.me=await r.json();renderAdmin();
  }catch(e){toast('Could not verify: '+e.message,true);}finally{busy(false);}
}
async function repoState(name){
  const r=await gh(wz.token,`/repos/${wz.me.login}/${name}`,{allow404:true});
  return r?{exists:true,ok:!!(r.permissions&&r.permissions.push),priv:r.private,branch:r.default_branch}:{exists:false};
}
async function wzCheckRepos(next){
  wz.portal=slug($('wzPortal').value)||'timex-ai-portal';wz.data=slug($('wzData').value)||'ai-portal-data';
  if(wz.portal===wz.data)return toast('Use two different repository names',true);
  busy(true,'Checking repositories…');
  try{
    wz.pState=await repoState(wz.portal);wz.dState=await repoState(wz.data);
    const bad=(wz.pState.exists&&!wz.pState.ok)||(wz.dState.exists&&!wz.dState.ok)||(wz.dState.exists&&!wz.dState.priv);
    if(next&&!bad)wz.step=3;renderAdmin();
    if(next&&bad)toast('Fix the repository names first',true);
  }catch(e){toast(e.message,true);}finally{busy(false);}
}
function wzPickFolder(list){
  const files=[...list].filter(f=>!/(^|\/)(\.git|\.DS_Store|Thumbs\.db)(\/|$)/.test(f.webkitRelativePath||f.name));
  if(!files.length)return toast('That folder is empty',true);
  const strip=p=>{const parts=p.split('/');return parts.length>1?parts.slice(1).join('/'):p;};
  wz.files=files.map(f=>({path:strip(f.webkitRelativePath||f.name),size:f.size,file:f}));
  wz.fromSite=false;renderAdmin();
}
async function wzFromSite(){
  busy(true,'Collecting files from this website…');
  try{
    const list=['index.html','portal-config.json','.nojekyll','README.md',...config.apps.map(a=>'apps/'+a.file)];
    const out=[];
    for(const p of list){const r=await fetch(p+'?t='+Date.now(),{cache:'no-store'});if(r.ok){const b=await r.arrayBuffer();out.push({path:p,size:b.byteLength,buf:b});}}
    wz.files=out;wz.fromSite=true;renderAdmin();
  }catch(e){toast(e.message,true);}finally{busy(false);}
}
function wzFilesNext(){
  if(!wz.files||!wz.files.length)return toast('Choose the portal folder first',true);
  if(!wz.files.some(f=>f.path==='index.html'))return toast('index.html is missing. Choose the timex-ai-portal folder itself.',true);
  const big=wz.files.find(f=>f.size>95*1048576);if(big)return toast(big.path+' is over GitHub\'s 100 MB limit',true);
  wz.step=4;renderAdmin();
}
function wzDataNext(){
  const t=$('wzDataTok').value.trim();if(!t)return toast('Paste the data token, or click Skip for now',true);
  if(t===wz.token)return toast('Use a separate token for data, not your admin token',true);
  wz.dataToken=t;wz.step=5;renderAdmin();
}
function wzLog(t,s,d){const l={t,s,d};wz.log.push(l);renderAdmin();return l;}
function wzSet(l,s,d){l.s=s;if(d!==undefined)l.d=d;renderAdmin();}
async function waitForBranch(R){
  for(let i=0;i<15;i++){
    const r=await gh(R.token,`${base(R)}/git/ref/heads/${encodeURIComponent(R.branch)}`,{allow404:true}).catch(e=>e.status===409?null:Promise.reject(e));
    if(r)return;await new Promise(x=>setTimeout(x,1500));
  }
  throw new Error('the new repository did not finish initializing. Please try again.');
}
async function ensureRepo(name,priv,desc){
  const st=await repoState(name);
  if(st.exists)return {branch:st.branch||'main',created:false};
  const r=await gh(wz.token,'/user/repos',{method:'POST',body:{name,private:priv,auto_init:true,description:desc}});
  const R={owner:wz.me.login,repo:name,branch:r.default_branch||'main',token:wz.token};
  await waitForBranch(R);
  return {branch:R.branch,created:true};
}
async function wzRun(){
  if(wz.running)return;wz.running=true;wz.log=[];wz.done=false;
  const login=wz.me.login;
  try{
    let l=wzLog('Portal repository '+login+'/'+wz.portal,'run');
    const P=await ensureRepo(wz.portal,false,'Timex Group AI Portal');wzSet(l,'ok',P.created?'Created (public)':'Already existed. It will be used.');
    l=wzLog('Data repository '+login+'/'+wz.data,'run');
    const D=await ensureRepo(wz.data,true,'Timex AI Portal data: analytics, libraries, submissions (private)');wzSet(l,'ok',D.created?'Created (private)':'Already existed. It will be used.');
    const PR={owner:login,repo:wz.portal,branch:P.branch,token:wz.token};
    l=wzLog('Uploading '+wz.files.length+' files and settings','run');
    await commit(PR,'Set up Timex AI Portal',async read=>{
      const out=[];let cfgText=null;
      for(const f of wz.files){
        const buf=f.buf||await f.file.arrayBuffer();
        if(f.path==='portal-config.json'){cfgText=new TextDecoder().decode(buf);continue;}
        out.push({path:f.path,content:buf});
      }
      const existing=await read('portal-config.json');
      let c=normalize(JSON.parse(existing||cfgText||'{}'));
      if(existing&&cfgText){const up=normalize(JSON.parse(cfgText));const ids=new Set(c.apps.map(a=>a.file));up.apps.forEach(a=>{if(!ids.has(a.file))c.apps.push(a);});}
      c.github={owner:login,repo:wz.portal,branch:P.branch};
      if(wz.dataToken)c.data={owner:login,repo:wz.data,branch:D.branch,key:obf(wz.dataToken)};
      else c.data=Object.assign(c.data||{},{owner:login,repo:wz.data,branch:D.branch});
      c.updatedAt=new Date().toISOString();config=c;
      if(!wz.files.some(f=>f.path==='.nojekyll'))out.push({path:'.nojekyll',content:''});
      out.push({path:'portal-config.json',content:JSON.stringify(stripRuntime(c),null,2)});
      return out;
    });
    wzSet(l,'ok','Committed to '+login+'/'+wz.portal);
    l=wzLog('Turning on GitHub Pages','run');
    try{await gh(wz.token,`/repos/${login}/${wz.portal}/pages`,{method:'POST',body:{build_type:'legacy',source:{branch:P.branch,path:'/'}}});wzSet(l,'ok','Pages enabled from '+P.branch+' /');}
    catch(e){if(e.status===409)wzSet(l,'ok','Already enabled');else wzSet(l,'warn','Could not turn on Pages automatically ('+e.message+'). Turn it on in the repo: Settings → Pages → Deploy from branch '+P.branch+' / root.');}
    if(wz.dataToken){
      l=wzLog('Testing the data token','run');
      try{const r=await gh(wz.dataToken,`/repos/${login}/${wz.data}`);if(!(r.permissions&&r.permissions.push))throw new Error('token has no write access');
        const DR={owner:login,repo:wz.data,branch:D.branch,token:wz.dataToken};
        await commit(DR,'Initialize portal data',async read=>(await read('submissions.json'))?[]:[{path:'submissions.json',content:'[]'}]);
        wzSet(l,'ok','Analytics and libraries will be saved to '+login+'/'+wz.data);}
      catch(e){wzSet(l,'warn','Data token problem: '+e.message+'. Fix it later in Admin Control → Data Storage.');}
    }else wzLog('Data token skipped','warn','Add it in Admin Control → Data Storage to turn on analytics and libraries.');
    admin={owner:login,repo:wz.portal,branch:P.branch,token:wz.token,login,avatar:wz.me.avatar_url,name:wz.me.name||login};
    localStorage.setItem(LS_ADMIN,JSON.stringify(admin));
    wz.url=`https://${login}.github.io/${wz.portal}/`;wz.done=true;
    wzLog('Admin connected on this browser','ok');
    toast('Setup complete');renderNav();
  }catch(e){wz.log.filter(x=>x.s==='run').forEach(x=>{x.s='err';x.d=e.message;});toast('Setup stopped: '+e.message,true);}
  finally{wz.running=false;renderAdmin();}
}

function admHide(id){run('Saving…',()=>publish('Toggle app visibility',c=>{const a=c.apps.find(x=>x.id===id);if(a)a.hidden=!a.hidden;}),'Saved');}
function admEdit(id){editModal(config.apps.find(a=>a.id===id),`admSaveEdit('${id}')`);}
function admSaveEdit(id){const v=readEditModal();closeModal();run('Saving…',()=>publish(`Edit app: ${v.name}`,c=>{const a=c.apps.find(x=>x.id===id);if(a){Object.assign(a,v);a.updatedAt=new Date().toISOString();}}),'Saved');}
function admReplace(id){pickFile(async f=>{const buf=await f.arrayBuffer();const a=config.apps.find(x=>x.id===id);
  run('Uploading new version of "'+a.name+'"…',()=>publish(`Update app: ${a.name}`,c=>{const x=c.apps.find(y=>y.id===id);x.v=(x.v||1)+1;x.updatedAt=new Date().toISOString();return [{path:'apps/'+x.file,content:buf}];}).then(()=>closeFrame(id)),'New version published');});}
function admDelete(id){const a=config.apps.find(x=>x.id===id);
  openModal(`<h3>Delete "${esc(a.name)}"?</h3><div class="msg">Removes it from the portal and deletes <span class="mono">apps/${esc(a.file)}</span> from the repository. Git history still keeps a copy.</div><div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="admDeleteGo('${id}')">🗑 Delete</button></div>`);}
function admDeleteGo(id){closeModal();closeFrame(id);run('Deleting…',()=>publish('Delete app',c=>{const a=c.apps.find(x=>x.id===id);c.apps=c.apps.filter(x=>x.id!==id);return a?[{path:'apps/'+a.file,content:null}]:[];}),'Deleted');}
function admSaveSettings(){
  const doms=$('sDom').value.split(',').map(s=>s.trim().replace(/^@/,'').toLowerCase()).filter(Boolean);
  if(!doms.length)return toast('Enter at least one email domain',true);
  run('Publishing settings…',()=>publish('Update portal settings',c=>{c.portalTitle=$('sTitle').value.trim()||'AI Portal';c.portalSubtitle=$('sSub').value.trim();c.allowedDomains=doms;}),'Settings published');
}
function dataForm(){const t=$('dToken').value.trim();return {owner:$('dOwner').value.trim(),repo:$('dRepo').value.trim(),branch:$('dBranch').value.trim()||'main',token:t||deobf(config.data.key)};}
async function admTestData(){
  const R=dataForm();if(!R.owner||!R.repo||!R.token)return toast('Fill in the data repository and token',true);
  busy(true,'Testing…');
  try{const r=await gh(R.token,`/repos/${R.owner}/${R.repo}`);if(!r.private)toast('Warning: the data repository is PUBLIC. Make it private.',true);else if(!(r.permissions&&r.permissions.push))throw new Error('token cannot write');else toast('Data repository OK ✓');}
  catch(e){toast('Test failed: '+e.message,true);}finally{busy(false);}
}
function admSaveData(){
  const R=dataForm();if(!R.owner||!R.repo||!R.token)return toast('Fill in the data repository and token',true);
  if(R.token===admin.token)return toast('Use a separate token for data, not your admin token',true);
  run('Publishing data settings…',()=>publish('Update data storage settings',c=>{c.data={owner:R.owner,repo:R.repo,branch:R.branch,key:obf(R.token)};}),'Data storage connected');
  lib=null;anaCache=null;
}
async function renderSubs(){
  const box=$('subsBox');const R=dataRepo();if(!box||!R)return;
  try{
    const t=await readFile(R,'submissions.json');const subs=(t?JSON.parse(t):[]).sort((a,b)=>(a.status==='submitted'?0:1)-(b.status==='submitted'?0:1)||(b.submittedAt>a.submittedAt?1:-1));
    if(!subs.length){box.innerHTML='<div class="note">No submissions yet. Users submit tools from My Library using 🚀.</div>';return;}
    const st={submitted:'<span class="tag amber">Pending</span>',published:'<span class="tag green">Published</span>',rejected:'<span class="tag red">Rejected</span>'};
    box.innerHTML=`<div class="tbl-wrap"><table class="tbl"><thead><tr><th></th><th>Tool</th><th>Submitted by</th><th>Note</th><th>Date</th><th>Status</th><th style="text-align:right">Actions</th></tr></thead><tbody>${subs.map(s=>`<tr>
      <td style="font-size:18px">${esc(s.icon||'📄')}</td><td><b>${esc(s.name)}</b><div style="font-size:11px;color:#999">${esc(s.description||'')} · ${fmtSize(s.size)}</div></td>
      <td>${esc(s.email)}</td><td style="font-size:11px;color:#666;max-width:220px">${esc(s.note||'—')}</td><td class="mono">${fmtDate(s.submittedAt)}</td><td>${st[s.status]||''}</td>
      <td><div class="row-actions">${s.status==='submitted'?`<button class="btn ghost sm" onclick="subPreview('${s.id}')">Preview</button><button class="btn green sm" onclick="subPublish('${s.id}')">Publish</button><button class="btn danger sm" onclick="subReject('${s.id}')">Reject</button>`:''}</div></td></tr>`).join('')}</tbody></table></div>`;
    window._subs=subs;
  }catch(e){box.innerHTML=`<div class="warn-box">Could not load submissions: ${esc(e.message)}</div>`;}
}
async function subPreview(id){const s=window._subs.find(x=>x.id===id);busy(true,'Opening preview…');try{const buf=await readFile(dataRepo(),s.path,null,true);window.open(URL.createObjectURL(new Blob([buf],{type:'text/html'})),'_blank');}catch(e){toast(e.message,true);}finally{busy(false);}}
async function markSub(id,status){
  const R=dataRepo();const s=window._subs.find(x=>x.id===id);const ldir=s.path.split('/files/')[0];
  await commit(R,`submission ${status}: ${s.name}`,async read=>{
    const subs=JSON.parse(await read('submissions.json')||'[]');const x=subs.find(y=>y.id===id);if(x){x.status=status;x.reviewedAt=new Date().toISOString();x.reviewedBy=user;}
    const out=[{path:'submissions.json',content:JSON.stringify(subs,null,2)}];
    const lt=await read(ldir+'/library.json');if(lt){const l=JSON.parse(lt);const it=l.items.find(i=>i.id===s.libId);if(it){it.status=status;out.push({path:ldir+'/library.json',content:JSON.stringify(l,null,2)});}}
    return out;
  });
}
function subPublish(id){
  const s=window._subs.find(x=>x.id===id);
  run('Publishing "'+s.name+'" to the portal…',async()=>{
    const buf=await readFile(dataRepo(),s.path,null,true);if(!buf)throw new Error('submitted file not found');
    await publish(`Publish submitted tool: ${s.name} (by ${s.email})`,c=>{
      const used=new Set(c.apps.map(a=>a.file));const b=slug(s.name);let file=b+'.html',i=2;while(used.has(file)){file=b+'-'+i+'.html';i++;}
      c.apps.push({id:'app-'+uid(),name:s.name,icon:s.icon||'📄',category:s.category||'General',description:s.description||'',file,v:1,hidden:false,addedAt:new Date().toISOString(),updatedAt:new Date().toISOString(),addedBy:s.email});
      return [{path:'apps/'+file,content:buf}];
    });
    await markSub(id,'published');if(user===s.email)lib=null;
  },'"'+s.name+'" published. It goes live in about a minute.');
}
function subReject(id){run('Saving…',()=>markSub(id,'rejected'),'Submission rejected');}

/* ── Modal ── */
function openModal(h){$('modalBox').innerHTML=h;$('modal').classList.add('show');}
function closeModal(){$('modal').classList.remove('show');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

boot();
</script>
</body>
</html>
